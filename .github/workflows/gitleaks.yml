name: gitleaks
# Secret scan on the PR diff only — historical findings can't block new PRs.
on:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install & run gitleaks on the PR diff
        run: |
          set -euo pipefail
          TAG=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${TAG}/gitleaks_${TAG}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
